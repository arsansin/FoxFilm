// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.12.0'
        classpath 'com.google.gms:google-services:4.4.3'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.10'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        // Aliyun JCenter mirror — hosts ExoPlayer 2.11.x and BlurView 1.6.6
        // (artifacts that were only ever published to the now-defunct JCenter)
        maven { url "https://maven.aliyun.com/repository/jcenter" }
        // Fallback mirror of Maven Central (useful when repo1.maven.org is unreachable)
        maven { url "https://maven.aliyun.com/repository/central" }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
