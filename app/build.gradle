plugins {
        id 'com.android.application'
        id 'org.jetbrains.kotlin.android'
}

android {
        compileSdk 34

        useLibrary 'org.apache.http.legacy'

        buildFeatures {
                aidl true
        }

        defaultConfig {
                applicationId "zakfilm.ir"
                namespace "zakfilm.ir"
                minSdkVersion 21
                targetSdkVersion 35
                versionCode 19
                versionName "18.21"
        }
        
        buildTypes {
                release {
                        minifyEnabled false
                        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
        }

        kotlinOptions {
                jvmTarget = '1.8'
        }

        lint {
                checkReleaseBuilds false
        }
}

dependencies {
        implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
        implementation 'androidx.appcompat:appcompat:1.7.1'
        implementation 'com.google.android.material:material:1.12.0'
        // Firebase as originally bundled by Sketchware Pro (BuiltInLibraries):
        // firebase-messaging 19.0.0 + firebase-iid 19.0.0 (the app code uses
        // the FirebaseInstanceId Task API that was removed from newer versions)
        implementation 'com.google.firebase:firebase-messaging:19.0.0'
        implementation 'com.google.firebase:firebase-iid:19.0.0'
        implementation 'com.github.bumptech.glide:glide:4.16.0'
        implementation 'com.google.code.gson:gson:2.11.0'
        implementation 'com.squareup.okhttp3:okhttp:4.12.0'
        implementation 'de.hdodenhof:circleimageview:3.1.0'
        implementation 'com.airbnb.android:lottie:6.5.2'
        // Sketchware embedded libraries, restored as Gradle dependencies (app code is untouched)
        // کتابخانه‌های داخلی اسکچ‌ور که در خروجی export حذف شده بودند — فقط به‌صورت وابستگی بازگردانده شده‌اند (کد برنامه دست‌نخورده است)
        implementation 'com.google.android.exoplayer:exoplayer:2.11.8'
        implementation 'com.adivery:sdk:4.9.0'
        implementation 'com.eightbitlab:blurview:1.6.6'
        implementation 'com.github.mreram:showcaseview:1.4.1'
        implementation 'io.github.everythingme:overscroll-decor-android:1.1.1'
}
